name: Collect job boards

# Manual until the join, lifecycle persistence and publication are ready.
on:
  workflow_dispatch:
    inputs:
      scope_limit:
        description: 'Scopes per shard (0 = all; 3 for a smoke run)'
        default: '0'
        required: true
      max_pages:
        description: 'Workable pages per query (5000 for a full walk)'
        default: '5000'
        required: true
      workable_countries:
        description: 'Workable country codes, e.g. DE,GB,IT (blank = all Europe)'
        required: false
      workable_remote:
        description: 'Additional worldwide remote query'
        type: choice
        options: [include, exclude, only]
        default: include

permissions:
  contents: read

jobs:
  collect:
    name: '${{ matrix.source }} ${{ matrix.shard }}-of-2'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        source: [ashby, greenhouse, workable]
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - name: Collect full raw jobs and scope outcomes
        env:
          SOURCE: '${{ matrix.source }}'
          SHARD: '${{ matrix.shard }}'
          RUN_ID: '${{ github.run_id }}-${{ github.run_attempt }}'
          SCOPE_LIMIT: '${{ inputs.scope_limit }}'
          MAX_PAGES: '${{ inputs.max_pages }}'
          WORKABLE_COUNTRIES: '${{ inputs.workable_countries }}'
          WORKABLE_REMOTE: '${{ inputs.workable_remote }}'
        run: >-
          uv run python -m jobboard.collect --source "$SOURCE"
          --shard-index "$SHARD" --shard-count 2 --run-id "$RUN_ID"
          --out "raw/$SOURCE/$SHARD-of-2"
          --limit-scopes "$SCOPE_LIMIT" --max-pages "$MAX_PAGES"
          --countries "$WORKABLE_COUNTRIES" --remote "$WORKABLE_REMOTE"
      # Upload successful scopes and partial positives even if another scope failed.
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: 'raw-${{ matrix.source }}-${{ matrix.shard }}-of-2'
          path: 'raw/${{ matrix.source }}/${{ matrix.shard }}-of-2/'
          if-no-files-found: error
          retention-days: 3
          overwrite: true
          compression-level: 0
